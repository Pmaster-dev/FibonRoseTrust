name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Issues ────────────────────────────────────────────────────────
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity in 60 days. It will be closed in 14 days unless activity
            resumes. Add a comment or update the issue to keep it open.
          close-issue-message: >
            This issue has been closed automatically due to inactivity. Feel free
            to reopen it if the problem still exists or the feature is still desired.

          # ── Pull Requests ─────────────────────────────────────────────────
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            any activity in 30 days. It will be closed in 7 days unless activity
            resumes. Rebase or add a comment to keep it open.
          close-pr-message: >
            This PR has been closed automatically due to inactivity. Feel free
            to reopen it when you're ready to continue.

          # ── Exemptions ────────────────────────────────────────────────────
          exempt-issue-labels: 'pinned,security,blocked,in-progress,fibonrose'
          exempt-pr-labels: 'pinned,security,blocked,in-progress,do-not-merge'
          exempt-draft-pr: true

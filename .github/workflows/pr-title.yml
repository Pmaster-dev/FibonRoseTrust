name: PR Title Lint

# Enforces Conventional Commits format on every PR title so changelogs and
# semantic-release work correctly.
# Valid prefixes: feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commits: type(optional-scope): description
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >
            The PR title subject must start with a lowercase letter.
            e.g. "feat: add user authentication" not "feat: Add user authentication"
          wip: true
          validateSingleCommit: false
